name: Integración y Despliegue Continuo (CI/CD)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Obtener caché de dependencias de pnpm
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Validar tipos de TypeScript
        run: pnpm run typecheck

      - name: Compilar backend y frontend
        env:
          NEXT_PUBLIC_API_URL: https://jorgedoicela.com
        run: pnpm run build

      - name: Preparar recursos estáticos de Next.js Standalone
        run: |
          rm -rf frontend/web/.next/standalone/frontend/web/public frontend/web/.next/standalone/frontend/web/.next/static
          mkdir -p frontend/web/.next/standalone/frontend/web/.next
          cp -r frontend/web/public frontend/web/.next/standalone/frontend/web/public
          cp -r frontend/web/.next/static frontend/web/.next/standalone/frontend/web/.next/static

      - name: Compilar y empaquetar imagen Docker del Sandbox en el Runner
        run: |
          docker build --platform linux/amd64 -t portfolio-sandbox:latest backend/src/portfolio/docker
          docker save portfolio-sandbox:latest | gzip > portfolio-sandbox.tar.gz

      - name: Desplegar archivos compilados a AWS Lightsail
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlgoDzc"
          SOURCE: "/"
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          TARGET: ${{ secrets.TARGET_DIR }}
          EXCLUDE: "/node_modules/, /out/, /.git/, /.github/, /backend/node_modules/, /frontend/web/node_modules/, *.sqlite, *.sqlite-journal, *.sqlite-wal, *.sqlite-shm, .env, .env.local, .env.development, .env.production, **/.env, **/.env.local, **/.env.development, **/.env.production"

      - name: Ejecutar tareas de inicio y reiniciar PM2 por SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ${{ secrets.TARGET_DIR }}
            
            # 1. Limpieza de rutas y artefactos legados en el VPS
            rm -rf frontend/web/src/app/api/landing frontend/web/src/app/\(landing\)/components frontend/web/src/app/\(landing\)/widgets/highlights-carousel/ui/slides/BibleSlideVisual.tsx GUIA_MIGRACION_PRODUCCION_DOICELADEV.md 2>/dev/null || true
            rm -rf frontend/web/src/app/\(bible\) backend/src/bible backend/dist/bible frontend/web/public/bible docs/04-bible .agents/skills/bible-* 2>/dev/null || true

            # 2. Instalar dependencias de produccion sin detener procesos activos (Zero-Downtime)
            CI=true pnpm --filter backend install --prod --frozen-lockfile --config.confirmModulesPurge=false
            pnpm --filter backend rebuild better-sqlite3
            
            # 3. Sembrado atomico en archivos temporales .sqlite.tmp (protege la BD previa ante fallos de corpus)
            mkdir -p backend/data
            rm -f backend/data/*.sqlite.tmp* 2>/dev/null || true

            echo "==> [CI/CD] Sembrando base de datos temporal: kartex.sqlite.tmp..."
            DATABASE_KARTEX_PATH=./data/kartex.sqlite.tmp node backend/dist/kartex/cli/seed-corpus.js
            echo "==> [CI/CD] Sembrando base de datos temporal: doiceladev.sqlite.tmp..."
            DATABASE_DOICELADEV_PATH=./data/doiceladev.sqlite.tmp node backend/dist/doiceladev/cli/seed-doiceladev.js
            echo "==> [CI/CD] Sembrando base de datos temporal: portfolio.sqlite.tmp..."
            DATABASE_PORTFOLIO_PATH=./data/portfolio.sqlite.tmp node backend/dist/portfolio/cli/seed-portfolio.js

            # 4. Reemplazo atomico instantaneo de bases de datos
            mv -f backend/data/kartex.sqlite.tmp backend/data/kartex.sqlite
            mv -f backend/data/doiceladev.sqlite.tmp backend/data/doiceladev.sqlite
            mv -f backend/data/portfolio.sqlite.tmp backend/data/portfolio.sqlite
            rm -f backend/data/*.sqlite-shm backend/data/*.sqlite-wal 2>/dev/null || true
            
            # 5. Asegurar recursos estáticos en standalone de forma limpia e idempotente
            rm -rf frontend/web/.next/standalone/frontend/web/public frontend/web/.next/standalone/frontend/web/.next/static
            mkdir -p frontend/web/.next/standalone/frontend/web/.next
            cp -r frontend/web/public frontend/web/.next/standalone/frontend/web/public
            cp -r frontend/web/.next/static frontend/web/.next/standalone/frontend/web/.next/static
            
            # 6. Garantizar permisos de lectura y ejecución para el servidor web (Nginx / www-data)
            chmod o+x /home/admin ${{ secrets.TARGET_DIR }} 2>/dev/null || true
            chmod -R o+rX frontend
            
            # 7. Actualizar y validar configuración de Nginx de forma automática
            if [ -f "nginx/jorgedoicela.com.conf" ]; then
              sudo cp nginx/jorgedoicela.com.conf /etc/nginx/sites-available/jorgedoicela.com
              sudo ln -sf /etc/nginx/sites-available/jorgedoicela.com /etc/nginx/sites-enabled/
              sudo nginx -t && sudo systemctl reload nginx
            fi

            # 8. Cargar imagen del sandbox efímero empaquetada en GitHub Actions
            if [ -f "portfolio-sandbox.tar.gz" ]; then
              echo "==> [CI/CD] Cargando imagen optimizada portfolio-sandbox en Docker..."
              docker load -i portfolio-sandbox.tar.gz
              rm -f portfolio-sandbox.tar.gz
              docker image prune -f >/dev/null 2>&1 || true
            fi

            # 9. Garantizar acceso al socket de Docker para el proceso backend en PM2
            id -nG admin 2>/dev/null | grep -q docker || sudo usermod -aG docker admin 2>/dev/null || true
            sudo chmod 660 /var/run/docker.sock 2>/dev/null || true

            # 10. Reiniciar aplicaciones en PM2 con nuevo entorno y guardar estado
            pm2 restart pm2.config.js --update-env || pm2 start pm2.config.js --update-env
            pm2 save

            # 11. Healthcheck activo post-despliegue (falla el pipeline si los servicios no responden HTTP 200)
            echo "==> [CI/CD] Verificando salud de servicios en loopback..."
            BACKEND_OK=0
            for i in $(seq 1 15); do
              if curl -fsS http://127.0.0.1:3000/api/doiceladev/portal?lang=es > /dev/null 2>&1; then
                echo "==> [CI/CD] Backend NestJS verificado exitosamente (intento $i)."
                BACKEND_OK=1
                break
              fi
              echo "==> [CI/CD] Esperando inicializacion del backend ($i/15)..."
              sleep 1
            done

            if [ "$BACKEND_OK" -ne 1 ]; then
              echo "ERROR CRITICO: El backend NestJS no respondio con HTTP 200 tras 15 segundos."
              exit 1
            fi

            FRONTEND_OK=0
            for i in $(seq 1 15); do
              if curl -fsS -H "Host: doiceladev.jorgedoicela.com" http://[::1]:3001 > /dev/null 2>&1; then
                echo "==> [CI/CD] Frontend Next.js verificado exitosamente (intento $i)."
                FRONTEND_OK=1
                break
              fi
              echo "==> [CI/CD] Esperando inicializacion del frontend ($i/15)..."
              sleep 1
            done

            if [ "$FRONTEND_OK" -ne 1 ]; then
              echo "ERROR CRITICO: El frontend Next.js no respondio con HTTP 200 tras 15 segundos."
              exit 1
            fi

            echo "==> [CI/CD] Despliegue verificado y 100% operativo en produccion."

      - name: Purgar automáticamente caché en Cloudflare
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_ZONE_ID }}" ] && [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "Purgando caché de Cloudflare automáticamente vía API..."
            RESPONSE=$(curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
              -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              --data '{"purge_everything":true}')
            echo "Respuesta de Cloudflare: $RESPONSE"
            if echo "$RESPONSE" | grep -q '"success":true'; then
              echo "Caché de Cloudflare purgada exitosamente."
            else
              echo "ADVERTENCIA: La purga en Cloudflare no reportó éxito. Revisa el token o la Zone ID."
            fi
          else
            echo "Aviso: CLOUDFLARE_ZONE_ID o CLOUDFLARE_API_TOKEN no configurados en GitHub Secrets (el header no-cache de Nginx previene la caché de HTML)."
          fi
