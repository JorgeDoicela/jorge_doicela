# Servidor HTTP: Redirección forzada hacia HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name jorgedoicela.com *.jorgedoicela.com;
    return 301 https://$host$request_uri;
}

# Servidor HTTPS: Cifrado SSL y Proxy Inverso
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name jorgedoicela.com *.jorgedoicela.com;

    # Certificados de Origen Cloudflare
    ssl_certificate /etc/ssl/certs/origin.pem;
    ssl_certificate_key /etc/ssl/private/private.key;

    # Cloudflare Authenticated Origin Pulls (mTLS)
    ssl_client_certificate /etc/ssl/certs/cloudflare.crt;
    ssl_verify_client on;
    error_page 496 =444 @cerrar_conexion;

    location @cerrar_conexion {
        return 444;
    }

    # Parámetros SSL y Cabeceras de Seguridad
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compresión Gzip
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # 1. API REST Backend NestJS (Puerto 3000) - Solo controladores REST del Backend
    location ~ ^/(bible/(verses|translations|morphology|books)|software/(projects|articles|forum)|portfolio/contact) {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 2. WebSockets de la Terminal SSH (Socket.io)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 3. Next.js Static Assets servidos directamente por Nginx (Alto Rendimiento y Cero Errores MIME)
    location /_next/static/ {
        alias /home/admin/jorge_doicela/frontend/web/.next/static/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 4. Next.js Public Assets (manifest.json, favicon, logos de proyectos, imágenes)
    location ~ ^/(manifest\.json|sw\.js|favicon\.ico|landing/|bible/logo/|software/logo/|portfolio/logo/) {
        root /home/admin/jorge_doicela/frontend/web/public;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # 5. Next.js Frontend Standalone (Puerto 3001) - Páginas, RSC y Rutas Dinámicas
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
