name: Integración y Despliegue Continuo (CI/CD)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Obtener caché de dependencias de pnpm
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Validar tipos de TypeScript
        run: pnpm run typecheck

      - name: Compilar backend y frontend
        env:
          NEXT_PUBLIC_API_URL: https://jorgedoicela.com
        run: pnpm run build

      - name: Preparar recursos estáticos de Next.js Standalone
        run: |
          rm -rf frontend/web/.next/standalone/frontend/web/public frontend/web/.next/standalone/frontend/web/.next/static
          mkdir -p frontend/web/.next/standalone/frontend/web/.next
          cp -r frontend/web/public frontend/web/.next/standalone/frontend/web/public
          cp -r frontend/web/.next/static frontend/web/.next/standalone/frontend/web/.next/static

      - name: Desplegar archivos compilados a AWS Lightsail
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlgoDzc"
          SOURCE: "/"
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          TARGET: ${{ secrets.TARGET_DIR }}
          EXCLUDE: "/node_modules/, /out/, /.git/, /.github/, /backend/node_modules/, /frontend/web/node_modules/, *.sqlite, *.sqlite-journal, *.sqlite-wal, *.sqlite-shm, .env, .env*, **/.env, **/.env*"

      - name: Ejecutar tareas de inicio y reiniciar PM2 por SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.TARGET_DIR }}
            
            # Instalar dependencias del backend de forma dedicada con filtro de monorepo pnpm en producción
            pnpm --filter backend install --prod --frozen-lockfile --ignore-scripts
            
            # Limpieza de bases de datos legadas fuera de backend/data/ (migración a nueva estructura)
            rm -f portfolio.sqlite *.sqlite-wal *.sqlite-shm 2>/dev/null || true
            rm -f backend/portfolio.sqlite backend/bible.sqlite backend/software.sqlite 2>/dev/null || true
            rm -f backend/*.sqlite-wal backend/*.sqlite-shm 2>/dev/null || true
            mkdir -p backend/data
            
            # Sincronización transaccional de bases de datos en producción (todos los módulos)
            cd backend && node dist/bible/cli/seed-corpus.js && node dist/software/cli/seed-software.js && node dist/portfolio/cli/seed-portfolio.js && cd ..
            
            # Asegurar recursos estáticos en standalone de forma limpia e idempotente
            rm -rf frontend/web/.next/standalone/frontend/web/public frontend/web/.next/standalone/frontend/web/.next/static
            mkdir -p frontend/web/.next/standalone/frontend/web/.next
            cp -r frontend/web/public frontend/web/.next/standalone/frontend/web/public
            cp -r frontend/web/.next/static frontend/web/.next/standalone/frontend/web/.next/static
            
            # Garantizar permisos de lectura y ejecución para el servidor web (Nginx / www-data)
            chmod o+x /home/admin ${{ secrets.TARGET_DIR }} 2>/dev/null || true
            chmod -R o+rX frontend
            
            # Actualizar y validar configuración de Nginx de forma automática
            if [ -f "nginx/jorgedoicela.com.conf" ]; then
              sudo cp nginx/jorgedoicela.com.conf /etc/nginx/sites-available/jorgedoicela.com
              sudo ln -sf /etc/nginx/sites-available/jorgedoicela.com /etc/nginx/sites-enabled/
              sudo nginx -t && sudo systemctl reload nginx
            fi

            # Reiniciar aplicaciones en PM2 con recarga limpia o iniciar si no estaban activas
            pm2 reload pm2.config.js --update-env || pm2 start pm2.config.js
            pm2 save

      - name: Purgar automáticamente caché en Cloudflare
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_ZONE_ID }}" ] && [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "Purgando caché de Cloudflare automáticamente vía API..."
            curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
              -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              --data '{"purge_everything":true}'
            echo "Caché de Cloudflare purgada exitosamente."
          else
            echo "Aviso: CLOUDFLARE_ZONE_ID o CLOUDFLARE_API_TOKEN no configurados en GitHub Secrets (el header no-cache de Nginx previene la caché)."
          fi
