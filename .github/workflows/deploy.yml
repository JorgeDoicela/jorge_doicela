name: Integración y Despliegue Continuo (CI/CD)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Obtener caché de dependencias de pnpm
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Validar tipos de TypeScript
        run: pnpm run typecheck

      - name: Compilar backend y frontend
        env:
          NEXT_PUBLIC_API_URL: https://jorgedoicela.com
        run: pnpm run build

      - name: Preparar recursos estáticos de Next.js Standalone
        run: |
          rm -rf frontend/web/.next/standalone/frontend/web/public frontend/web/.next/standalone/frontend/web/.next/static
          mkdir -p frontend/web/.next/standalone/frontend/web/.next
          cp -r frontend/web/public frontend/web/.next/standalone/frontend/web/public
          cp -r frontend/web/.next/static frontend/web/.next/standalone/frontend/web/.next/static

      - name: Desplegar archivos compilados a AWS Lightsail
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlgoDzc"
          SOURCE: "/"
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          TARGET: ${{ secrets.TARGET_DIR }}
          EXCLUDE: "/node_modules/, /out/, /.git/, /.github/, /backend/node_modules/, /frontend/web/node_modules/, *.sqlite, *.sqlite-journal, *.sqlite-wal, *.sqlite-shm, .env, .env*, **/.env, **/.env*"

      - name: Ejecutar tareas de inicio y reiniciar PM2 por SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.TARGET_DIR }}
            
            # 1. Detener procesos en PM2 para liberar los file descriptors de SQLite en memoria
            pm2 stop pm2.config.js 2>/dev/null || true
            
            # 2. Instalar dependencias del backend en producción con filtro monorepo
            pnpm --filter backend install --prod --frozen-lockfile --ignore-scripts
            
            # 3. Limpieza física y reinicio total de las bases de datos en producción
            rm -f backend/data/*.sqlite* 2>/dev/null || true
            rm -f backend/*.sqlite* 2>/dev/null || true
            rm -f *.sqlite* 2>/dev/null || true
            mkdir -p backend/data
            
            # 4. Reconstrucción atómica y seeding completo desde los corpus JSON compilados
            echo "==> [CI/CD] Sembrando base de datos: bible.sqlite..."
            node backend/dist/bible/cli/seed-corpus.js
            echo "==> [CI/CD] Sembrando base de datos: software.sqlite..."
            node backend/dist/software/cli/seed-software.js
            echo "==> [CI/CD] Sembrando base de datos: portfolio.sqlite..."
            node backend/dist/portfolio/cli/seed-portfolio.js
            
            # 5. Asegurar recursos estáticos en standalone de forma limpia e idempotente
            rm -rf frontend/web/.next/standalone/frontend/web/public frontend/web/.next/standalone/frontend/web/.next/static
            mkdir -p frontend/web/.next/standalone/frontend/web/.next
            cp -r frontend/web/public frontend/web/.next/standalone/frontend/web/public
            cp -r frontend/web/.next/static frontend/web/.next/standalone/frontend/web/.next/static
            
            # 6. Garantizar permisos de lectura y ejecución para el servidor web (Nginx / www-data)
            chmod o+x /home/admin ${{ secrets.TARGET_DIR }} 2>/dev/null || true
            chmod -R o+rX frontend
            
            # 7. Actualizar y validar configuración de Nginx de forma automática
            if [ -f "nginx/jorgedoicela.com.conf" ]; then
              sudo cp nginx/jorgedoicela.com.conf /etc/nginx/sites-available/jorgedoicela.com
              sudo ln -sf /etc/nginx/sites-available/jorgedoicela.com /etc/nginx/sites-enabled/
              sudo nginx -t && sudo systemctl reload nginx
            fi

            # 8. Construir/actualizar imagen del sandbox efímero si existen cambios
            if [ -d "backend/src/portfolio/docker" ]; then
              docker build -t portfolio-sandbox:latest backend/src/portfolio/docker/ 2>/dev/null || true
            fi

            # 9. Garantizar acceso al socket de Docker para el proceso backend en PM2
            id -nG admin 2>/dev/null | grep -q docker || sudo usermod -aG docker admin 2>/dev/null || true
            sudo chmod 660 /var/run/docker.sock 2>/dev/null || true

            # 10. Iniciar o reiniciar aplicaciones en PM2 con nuevo entorno y guardar estado
            pm2 restart pm2.config.js --update-env || pm2 start pm2.config.js --update-env
            pm2 save

      - name: Purgar automáticamente caché en Cloudflare
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_ZONE_ID }}" ] && [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "Purgando caché de Cloudflare automáticamente vía API..."
            RESPONSE=$(curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
              -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              --data '{"purge_everything":true}')
            echo "Respuesta de Cloudflare: $RESPONSE"
            if echo "$RESPONSE" | grep -q '"success":true'; then
              echo "Caché de Cloudflare purgada exitosamente."
            else
              echo "ADVERTENCIA: La purga en Cloudflare no reportó éxito. Revisa el token o la Zone ID."
            fi
          else
            echo "Aviso: CLOUDFLARE_ZONE_ID o CLOUDFLARE_API_TOKEN no configurados en GitHub Secrets (el header no-cache de Nginx previene la caché de HTML)."
          fi
